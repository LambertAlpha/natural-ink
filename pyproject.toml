[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "natural-ink"
version = "0.1.0"
description = "Deterministic handwriting-style documents and experimental editable ink export"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fonttools>=4.55,<5", "reportlab>=4.2,<5", "pymupdf>=1.25,<2",
  "numpy>=2,<3", "scipy>=1.14,<2", "scikit-image>=0.25,<1", "lz4>=4.3,<5",
  "pydantic>=2.10,<3",
]

[project.scripts]
natural-ink = "natural_ink.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/natural_ink"]
